[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kbimporter"
version = "0.4.0"
description = "知识库导入程序：统一 Zotero 同步、文档转 Markdown、去重清理与 Milvus 向量化导入"
readme = "README.md"
license = "MIT"
authors = [{ name = "yangjiafengzi", email = "denghanqing@whu.edu.cn" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/yangjiafengzi/kbimporter"
Repository = "https://github.com/yangjiafengzi/kbimporter"

[project.optional-dependencies]
import = ["pymilvus>=2.4,<3.1", "pypinyin>=0.52"]
sync = ["PyMuPDF>=1.24", "EbookLib>=0.18", "beautifulsoup4>=4.12"]
convert = ["marker-pdf>=1.0", "markitdown>=0.1"]
ocr = ["marker-pdf>=1.0", "markitdown>=0.1"]
cloud = ["openai>=1.0", "PyMuPDF>=1.24", "requests>=2.31"]
dedupe = ["pdfplumber>=0.11", "EbookLib>=0.18", "beautifulsoup4>=4.12"]
search = ["pymilvus>=2.4,<3.1"]
dev = ["pytest>=8"]
all = [
    "pymilvus>=2.4,<3.1",
    "pypinyin>=0.52",
    "PyMuPDF>=1.24",
    "EbookLib>=0.18",
    "beautifulsoup4>=4.12",
    "marker-pdf>=1.0",
    "markitdown>=0.1",
    "openai>=1.0",
    "requests>=2.31",
    "pdfplumber>=0.11",
]

[project.scripts]
kb = "kbimporter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
